-- Cassiopeia custom Hyprland config
-- Native Hyprland syntax only

# === DMS IPC: Audio ===
bind = SUPER + SHIFT + M, spawn, dms ipc call mic mute
bind = NONE, XF86AudioRaiseVolume, spawn, dms ipc call audio increment 2
bind = NONE, XF86AudioLowerVolume, spawn, dms ipc call audio decrement 2
bind = NONE, XF86AudioMute, spawn, dms ipc call audio mute

# === DMS IPC: Media ===
bind = NONE, XF86AudioPlay, spawn, dms ipc call mpris playPause
bind = NONE, XF86AudioNext, spawn, dms ipc call mpris next
bind = NONE, XF86AudioPrev, spawn, dms ipc call mpris previous
bind = NONE, XF86AudioStop, spawn, dms ipc call mpris stop

# === DMS IPC: Brightness ===
bind = NONE, XF86MonBrightnessUp, spawn, dms ipc call brightness increment 10
bind = NONE, XF86MonBrightnessDown, spawn, dms ipc call brightness decrement 10

# === DMS IPC: Night mode ===
bind = SUPER + SHIFT + N, spawn, dms ipc call night toggle

# === DMS IPC: Lock / Inhibit ===
bind = SUPER + L, spawn, dms ipc call lock lock
bind = SUPER + SHIFT + L, spawn, dms ipc call inhibit toggle || loginctl suspend

# === DMS IPC: Power profile ===
bind = SUPER + SHIFT + P, spawn, dms ipc call powerprofile cycle

# === DMS IPC: Wallpaper ===
bind = SUPER + SHIFT + W, spawn, dms ipc call wallpaper next

# === DMS IPC: Theme ===
bind = SUPER + SHIFT + T, spawn, dms ipc call theme toggle

# === DMS IPC: Sessions ===
bind = SUPER + SHIFT + S, spawn, dms ipc call sessions open

# === Direct utilities ===
bind = SUPER + SHIFT + C, spawn, hyprpicker -a
bind = SUPER + SHIFT + R, spawn, wf-recorder -f /tmp/recording_%s.mp4
bind = Print, spawn, grim -o "$(hyprctl activeworkspace -j | jq -r '.monitor')" - | wl-copy
bind = SUPER + Print, spawn, hyprshot --freeze --clipboard-only --mode region --silent

# === Hyprland window management ===
bind = SUPER + Q, closewindow
bind = SUPER + D, fullscreen, 1
bind = SUPER + F, fullscreen, 0
bind = SUPER + ALT + Space, togglefloating

# Direction focus/move
bind = SUPER + Left, movefocus, l
bind = SUPER + Right, movefocus, r
bind = SUPER + Up, movefocus, u
bind = SUPER + Down, movefocus, d

bind = SUPER + SHIFT + Left, movewindow, l
bind = SUPER + SHIFT + Right, movewindow, r
bind = SUPER + SHIFT + Up, movewindow, u
bind = SUPER + SHIFT + Down, movewindow, d

# === Workspaces ===
bind = SUPER + 1, workspace, 1
bind = SUPER + 2, workspace, 2
bind = SUPER + 3, workspace, 3
bind = SUPER + 4, workspace, 4
bind = SUPER + 5, workspace, 5
bind = SUPER + 6, workspace, 6
bind = SUPER + 7, workspace, 7
bind = SUPER + 8, workspace, 8
bind = SUPER + 9, workspace, 9
bind = SUPER + 0, workspace, 10

bind = SUPER + SHIFT + 1, movetoworkspace, 1
bind = SUPER + SHIFT + 2, movetoworkspace, 2
bind = SUPER + SHIFT + 3, movetoworkspace, 3
bind = SUPER + SHIFT + 4, movetoworkspace, 4
bind = SUPER + SHIFT + 5, movetoworkspace, 5
bind = SUPER + SHIFT + 6, movetoworkspace, 6
bind = SUPER + SHIFT + 7, movetoworkspace, 7
bind = SUPER + SHIFT + 8, movetoworkspace, 8
bind = SUPER + SHIFT + 9, movetoworkspace, 9
bind = SUPER + SHIFT + 0, movetoworkspace, 10

bind = SUPER + ALT + 1, movetoworkspace, silent, 1; workspace, 1
bind = SUPER + ALT + 2, movetoworkspace, silent, 2; workspace, 2
bind = SUPER + ALT + 3, movetoworkspace, silent, 3; workspace, 3
bind = SUPER + ALT + 4, movetoworkspace, silent, 4; workspace, 4
bind = SUPER + ALT + 5, movetoworkspace, silent, 5; workspace, 5
bind = SUPER + ALT + 6, movetoworkspace, silent, 6; workspace, 6
bind = SUPER + ALT + 7, movetoworkspace, silent, 7; workspace, 7
bind = SUPER + ALT + 8, movetoworkspace, silent, 8; workspace, 8
bind = SUPER + ALT + 9, movetoworkspace, silent, 9; workspace, 9
bind = SUPER + ALT + 0, movetoworkspace, silent, 10; workspace, 10

# === Apps ===
bind = SUPER + Return, spawn, kitty
bind = SUPER + E, spawn, kitty --class file-manager -e ranger || thunar || pcmanfm
bind = SUPER + W, spawn, brave || zen-browser || firefox
bind = SUPER + C, spawn, lapce
bind = SUPER + X, spawn, kitty --class scratchpad
bind = SUPER + V, spawn, pavucontrol || paman
bind = SUPER + B, spawn, brave

# === System ===
bind = SUPER + SHIFT + Q, exit
bind = SUPER + SHIFT + R, reload
