# Cassiopeia custom Hyprland keybinds
# Native Hyprland syntax — sourced by hyprland.conf
# DMS binds live in hyprland.lua via hl.bind / hl.dsp.exec_cmd

# === Launchers ===
bind = SUPER, Return, exec, kitty
bind = SUPER, E, exec, thunar
bind = SUPER, W, exec, brave
bind = SUPER, C, exec, lapce
bind = SUPER, X, exec, kitty --class scratchpad
bind = SUPER, B, exec, brave
bind = SUPER_SHIFT, V, exec, pavucontrol

# === Window management ===
bind = SUPER, Q, closewindow
bind = SUPER, D, fullscreen, 1
bind = SUPER, F, fullscreen, 0
bind = SUPER, ALT, space, togglefloating

bind = SUPER, Left, movefocus, l
bind = SUPER, Right, movefocus, r
bind = SUPER, Up, movefocus, u
bind = SUPER, Down, movefocus, d

bind = SUPER_SHIFT, Left, movewindow, l
bind = SUPER_SHIFT, Right, movewindow, r
bind = SUPER_SHIFT, Up, movewindow, u
bind = SUPER_SHIFT, Down, movewindow, d

# === Workspaces ===
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = SUPER_SHIFT, 1, movetoworkspace, 1
bind = SUPER_SHIFT, 2, movetoworkspace, 2
bind = SUPER_SHIFT, 3, movetoworkspace, 3
bind = SUPER_SHIFT, 4, movetoworkspace, 4
bind = SUPER_SHIFT, 5, movetoworkspace, 5
bind = SUPER_SHIFT, 6, movetoworkspace, 6
bind = SUPER_SHIFT, 7, movetoworkspace, 7
bind = SUPER_SHIFT, 8, movetoworkspace, 8
bind = SUPER_SHIFT, 9, movetoworkspace, 9
bind = SUPER_SHIFT, 0, movetoworkspace, 10

bind = SUPER_ALT, 1, movetoworkspace, silent, 1; workspace, 1
bind = SUPER_ALT, 2, movetoworkspace, silent, 2; workspace, 2
bind = SUPER_ALT, 3, movetoworkspace, silent, 3; workspace, 3
bind = SUPER_ALT, 4, movetoworkspace, silent, 4; workspace, 4
bind = SUPER_ALT, 5, movetoworkspace, silent, 5; workspace, 5
bind = SUPER_ALT, 6, movetoworkspace, silent, 6; workspace, 6
bind = SUPER_ALT, 7, movetoworkspace, silent, 7; workspace, 7
bind = SUPER_ALT, 8, movetoworkspace, silent, 8; workspace, 8
bind = SUPER_ALT, 9, movetoworkspace, silent, 9; workspace, 9
bind = SUPER_ALT, 0, movetoworkspace, silent, 10; workspace, 10

# === System ===
bind = SUPER_SHIFT, Q, exit
bind = SUPER_SHIFT, R, reload
