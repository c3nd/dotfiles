# starship minimal space prompt for Cassiopeia
"$schema" = "https://starship.rs/config-schema.json"
add_newline = false
format = """
[┌─](bold green) $directory[](bold green)$git_branch$git_status
[└─](bold green) $character"""

[directory]
style = "bold blue"

[git_branch]
format = "[$branch]($style) "
style = "bold purple"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
